# HTTPS in front of Pramanik. Replace the server name and certificate paths (for example from Let's Encrypt).
server {
    listen 80;
    server_name pramanik.example.gov.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # on nginx 1.25.1+ you may use `listen 443 ssl;` plus `http2 on;` instead
    server_name pramanik.example.gov.in;

    ssl_certificate     /etc/letsencrypt/live/pramanik.example.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pramanik.example.gov.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 11m;          # the app accepts 10 MB files plus form overhead
    proxy_read_timeout 120s;           # reading a photo with OCR can take a while on a busy server

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # lets the app mark the session cookie Secure
    }
}
