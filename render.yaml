# Render Blueprint, FREE demo version: New + > Blueprint > pick this repository. See deploy/RENDER.md.
# Free instances have no persistent disk: accounts and keys reset whenever the instance sleeps or restarts. That is fine for
# showing the app; for real use switch to deploy/render.paid.yaml (bigger plan + a disk).
services:
  - type: web
    name: pramanik
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PRAMANIK_SIGNUP_CODE
        sync: false              # Render asks you for it; anyone who knows it can create an account
      - key: PRAMANIK_SESSION_HOURS
        value: "8"
      - key: PRAMANIK_MAX_SCANS
        value: "1"               # read photos one at a time: keeps memory low
      - key: PRAMANIK_MAX_IMAGE_SIDE
        value: "2000"            # keep large phone photos at 2000 px: measured peak 380 MB (a free instance has 512 MB)
      - key: PRAMANIK_SKIP_DEMO_DOCS
        value: "1"
      - key: PRAMANIK_DEMO
        value: "1"               # makes sample documents at start-up and offers them at /demo
